services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: goldfactory
      POSTGRES_USER: goldadmin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

  app:
    build: .
    depends_on: [db]
    environment:
      DATABASE_URL: postgres://goldadmin:${DB_PASSWORD}@db:5432/goldfactory
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
    volumes: [uploads:/data/uploads]
    restart: unless-stopped

  # بوابة HTTPS: شهادة مجانية تلقائية للدومين المحدد في DOMAIN
  caddy:
    image: caddy:2-alpine
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
